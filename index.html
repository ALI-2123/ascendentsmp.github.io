<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Portal</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #0c0d10; 
            color: #ffffff; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        header { 
            background-color: #141619; 
            border-bottom: 1px solid #282c37; 
            padding: 15px 40px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .logo { 
            font-size: 1.4rem; 
            font-weight: 800; 
            color: #ffaa00; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        nav { 
            display: flex; 
            gap: 20px; 
        }
        nav a { 
            color: #a0a5b1; 
            text-decoration: none; 
            font-weight: 600; 
            font-size: 0.95rem; 
        }
        nav a:hover, nav a.active { 
            color: #ffaa00; 
        }
        .hero { 
            text-align: center; 
            padding: 50px 20px 30px; 
            background: radial-gradient(circle at center, #1b1e26 0%, #0c0d10 70%); 
        }
        .hero h1 { 
            font-size: 2.5rem; 
            font-weight: 900; 
            margin-bottom: 10px; 
        }
        .hero h1 span { 
            color: #ffaa00; 
        }
        .hero p { 
            color: #a0a5b1; 
            margin-bottom: 20px; 
        }
        .main-container { 
            max-width: 1100px; 
            margin: 30px auto; 
            padding: 0 20px; 
            flex: 1; 
        }
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 25px; 
        }
        .card-link { 
            text-decoration: none; 
            color: inherit; 
            display: block; 
        }
        .card { 
            background-color: #141619; 
            border: 1px solid #282c37; 
            border-radius: 14px; 
            padding: 24px; 
            height: 100%; 
            transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4); 
        }
        .card:hover { 
            transform: translateY(-4px); 
            border-color: #ffaa00; 
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.25);
        }
        .card.support-card { 
            border: 2px solid #ffaa00; 
        }
        .card h2 { 
            color: #ffaa00; 
            margin-bottom: 10px; 
            font-size: 1.25rem; 
            font-weight: 800; 
        }
        .card p { 
            color: #a0a5b1; 
            font-size: 0.95rem; 
            line-height: 1.4; 
        }
        footer { 
            background-color: #141619; 
            border-top: 1px solid #282c37; 
            text-align: center; 
            padding: 20px; 
            color: #6c727f; 
            font-size: 0.85rem; 
            margin-top: auto; 
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">NETWORK PORTAL</div>
        <nav>
            <a href="index.html" class="active">Home</a>
            <a href="support.html">Support & Tickets</a>
            <a href="admin.html">Admin Panel</a>
        </nav>
    </header>

    <section class="hero">
        <h1>WELCOME TO THE <span>SERVER PORTAL</span></h1>
        <p>Need staff assistance or want to report an issue? Visit our support desk below.</p>
    </section>

    <main class="main-container">
        <div class="grid">
            <!-- CLICKABLE SUPPORT CARD -->
            <a href="support.html" class="card-link">
                <div class="card support-card">
                    <h2>SUPPORT & TICKETS 🎧</h2>
                    <p>Submit support tickets & get direct staff help</p>
                </div>
            </a>
        </div>
    </main>

    <footer>
        &copy; 2026 Server Network. All rights reserved.
    </footer>

</body>
</html>
