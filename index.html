<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ascendant SMP | Official Network</title>
  <link rel="icon" type="image/png" href="logo.png">
  
  <style>
    :root {
      --bg-dark: #090a0f;
      --card-bg: rgba(18, 22, 32, 0.85);
      --gold: #ffaa00;
      --gold-glow: rgba(255, 170, 0, 0.4);
      --text-main: #ffffff;
      --text-sub: #a0a8c0;
      --border-color: rgba(255, 255, 255, 0.1);
      --elite-cyan: #00f2fe;
      --elite-glow: rgba(0, 242, 254, 0.4);
      --red: #ff4757;
      --green: #2ed573;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, rgba(255, 170, 0, 0.15) 0%, transparent 60%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    #particleCanvas {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 0;
    }

    .container { max-width: 900px; width: 100%; display: flex; flex-direction: column; gap: 30px; z-index: 1; }

    header { text-align: center; }
    .header-logo-img { max-width: 130px; margin-bottom: 15px; filter: drop-shadow(0px 0px 12px var(--gold-glow)); }
    .logo { font-size: 3rem; font-weight: 900; letter-spacing: 3px; }
    .logo span { color: var(--gold); }
    .tagline { color: var(--text-sub); font-size: 1.1rem; margin-top: 8px; }

    .info-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 30px; text-align: center; }
    .info-section h2 { color: var(--gold); margin-bottom: 20px; font-size: 1.5rem; }

    /* GAME UI */
    .quiz-container { width: 100%; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }

    .queue-box {
      background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-color); border-radius: 10px; padding: 25px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }

    .queue-count { font-size: 1.1rem; color: var(--text-sub); font-weight: 700; }
    .queue-count span { color: var(--gold); font-size: 1.3rem; }

    .game-status { font-size: 1.1rem; font-weight: 800; color: var(--gold); min-height: 28px; }

    .quiz-scores { display: flex; justify-content: space-between; width: 100%; font-size: 1.2rem; font-weight: 900; }
    .p1-score { color: var(--gold); }
    .p2-score { color: var(--elite-cyan); }

    .quiz-timer-bar {
      width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 4px; overflow: hidden;
    }
    .quiz-timer-fill {
      height: 100%; width: 100%; background: var(--gold); transition: width 1s linear;
    }

    .quiz-card {
      background: rgba(0, 0, 0, 0.5); border: 1px solid var(--gold); border-radius: 12px; padding: 20px;
      font-size: 1.15rem; font-weight: 800; min-height: 90px; display: flex; justify-content: center; align-items: center; text-align: center;
    }

    .quiz-answers-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }

    .ans-btn {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: #fff;
      padding: 14px; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: 0.2s;
    }
    .ans-btn:hover:not(:disabled) { border-color: var(--gold); background: rgba(255, 170, 0, 0.15); }
    .ans-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .game-btn {
      background: var(--gold); color: #000; border: none; padding: 10px 22px; font-weight: 800;
      border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 0.95rem;
    }
    .game-btn:hover { transform: scale(1.05); }
    .game-btn.leave-btn { background: var(--red); color: #fff; }
  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <main class="container">
    <header>
      <img src="logo.png" alt="Ascendant SMP Logo" class="header-logo-img">
      <h1 class="logo">ASCENDANT <span>SMP</span></h1>
      <p class="tagline">🌌 ⚔️ 1v1 Queue Quiz Matchmaker ⚔️ 🌌</p>
    </header>

    <section class="info-section">
      <h2>⚔️ 1v1 QUIZ ARENA</h2>
      
      <div class="quiz-container">
        
        <!-- Queue Lobby Box -->
        <div class="queue-box" id="queueBox">
          <div class="queue-count">Players in Lobby: <span id="lobbyCount">0 / 2</span></div>
          <div class="game-status" id="queueStatus">Click JOIN QUEUE to enter matchmaking!</div>
          <button class="game-btn" id="joinQueueBtn" onclick="toggleQueue()">JOIN QUEUE</button>
        </div>

        <!-- Active Match Arena (Hidden by Default) -->
        <div id="matchArea" style="display: none; flex-direction: column; gap: 15px;">
          <div class="quiz-scores">
            <span class="p1-score">YOU (P1): <span id="p1Score">0</span></span>
            <span class="p2-score"><span id="p2Name">OPPONENT</span> (P2): <span id="p2Score">0</span></span>
          </div>

          <div class="quiz-timer-bar">
            <div class="quiz-timer-fill" id="timerFill"></div>
          </div>

          <div class="game-status" id="quizStatus">First to 5 Points Wins!</div>
          <div class="quiz-card" id="quizQuestion">❓ Match Starting...</div>
          
          <div class="quiz-answers-grid" id="quizAnswers">
            <button class="ans-btn" onclick="answerQuiz(0)">Option A</button>
            <button class="ans-btn" onclick="answerQuiz(1)">Option A</button>
            <button class="ans-btn" onclick="answerQuiz(2)">Option A</button>
            <button class="ans-btn" onclick="answerQuiz(3)">Option A</button>
          </div>

          <div style="display: flex; justify-content: center; margin-top: 5px;">
            <button class="game-btn leave-btn" onclick="leaveQuizMatch()">LEAVE MATCH</button>
          </div>
        </div>

      </div>
    </section>
  </main>

  <script>
    /* PARTICLES ENGINE */
    const canvas = document.getElementById("particleCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener("resize", () => { resizeCanvas(); initParticles(); });
    resizeCanvas();

    class Particle {
      constructor() { this.reset(true); }
      reset(initial = false) {
        this.x = Math.random() * canvas.width;
        this.y = initial ? Math.random() * canvas.height : canvas.height + 10;
        this.size = Math.random() * 2 + 0.8;
        this.speedY = -(Math.random() * 0.5 + 0.2);
        this.color = ["#ffaa00", "#00f2fe", "#ab47bc"][Math.floor(Math.random() * 3)];
        this.alpha = Math.random() * 0.6 + 0.2;
      }
      update() {
        this.y += this.speedY;
        if (this.y < -10) this.reset(false);
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function initParticles() {
      particles = [];
      for (let i = 0; i < 40; i++) particles.push(new Particle());
    }
    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animateParticles);
    }
    initParticles(); animateParticles();

    /* =========================================================
       1v1 QUIZ MATCHMAKING & ENGINE
       ========================================================= */
    const quizDatabase = [
      { q: "Which tool speed multiplier does Efficiency V grant?", a: ["+150%", "+250%", "+300%", "+500%"], correct: 3 },
      { q: "What is the primary ingredient used to craft End Crystals?", a: ["Eye of Ender", "Ghast Tear", "End Stone", "Nether Star"], correct: 1 },
      { q: "Which potion effect counters Poison completely?", a: ["Regeneration", "Milk", "Strength", "Instant Health"], correct: 1 },
      { q: "How much maximum extra damage can a Mace execute with heavy fall height?", a: ["10 Hearts", "20 Hearts", "Uncapped", "50 Hearts"], correct: 2 },
      { q: "What item is required to charge an Anchor for Explosive PvP?", a: ["Glowstone", "Blaze Powder", "Ender Pearl", "Redstone"], correct: 0 },
      { q: "What enchantment boosts attack speed on weapons?", a: ["Haste", "Quick Draw", "Sweeping Edge", "None (No Ench)"], correct: 3 },
      { q: "Which food item gives the fastest saturation in Minecraft?", a: ["Golden Carrot", "Enchanted Apple", "Steak", "Porkchop"], correct: 0 }
    ];

    let inQueue = false;
    let matchActive = false;
    let queueTimer = null;
    let botTimer = null;
    let roundCountdown = null;
    
    let currentQuizIndex = 0;
    let p1Score = 0;
    let p2Score = 0;
    let questionAnswered = false;
    let secondsLeft = 10;

    const botNames = ["AuraPvP_99", "CrystalGod", "MaceKing", "VoidWalker", "Shadow_X"];

    function toggleQueue() {
      if (inQueue) {
        leaveQueue();
      } else {
        joinQueue();
      }
    }

    function joinQueue() {
      clearAllTimers();
      inQueue = true;
      
      const btn = document.getElementById("joinQueueBtn");
      btn.innerText = "CANCEL QUEUE";
      btn.classList.add("leave-btn");
      
      document.getElementById("lobbyCount").innerText = "1 / 2";
      document.getElementById("queueStatus").innerText = "Searching for opponent...";

      let seconds = 0;
      queueTimer = setInterval(() => {
        seconds++;
        document.getElementById("queueStatus").innerText = `Searching for opponent... (${seconds}s)`;
        
        if (seconds >= 3) {
          clearInterval(queueTimer);
          document.getElementById("lobbyCount").innerText = "2 / 2";
          document.getElementById("queueStatus").innerText = "Match Found! Starting Quiz...";
          setTimeout(startQuizMatch, 1000);
        }
      }, 1000);
    }

    function leaveQueue() {
      inQueue = false;
      clearAllTimers();
      
      const btn = document.getElementById("joinQueueBtn");
      btn.innerText = "JOIN QUEUE";
      btn.classList.remove("leave-btn");
      
      document.getElementById("lobbyCount").innerText = "0 / 2";
      document.getElementById("queueStatus").innerText = "Click JOIN QUEUE to enter matchmaking!";
    }

    function startQuizMatch() {
      inQueue = false;
      matchActive = true;
      p1Score = 0;
      p2Score = 0;

      const randomBot = botNames[Math.floor(Math.random() * botNames.length)];
      document.getElementById("p2Name").innerText = randomBot;
      document.getElementById("p1Score").innerText = "0";
      document.getElementById("p2Score").innerText = "0";

      document.getElementById("queueBox").style.display = "none";
      document.getElementById("matchArea").style.display = "flex";

      loadNextQuizQuestion();
    }

    function loadNextQuizQuestion() {
      if (!matchActive) return;

      clearAllTimers();
      questionAnswered = false;
      secondsLeft = 10;
      updateTimerBar(100);

      currentQuizIndex = Math.floor(Math.random() * quizDatabase.length);
      const qData = quizDatabase[currentQuizIndex];

      document.getElementById("quizStatus").innerText = "First to 5 Points Wins!";
      document.getElementById("quizQuestion").innerText = `❓ ${qData.q}`;

      const buttons = document.querySelectorAll("#quizAnswers .ans-btn");
      buttons.forEach((btn, idx) => {
        btn.innerText = `${String.fromCharCode(65 + idx)}: ${qData.a[idx]}`;
        btn.disabled = false;
        btn.style.background = "rgba(255, 255, 255, 0.05)";
      });

      // 10-Second Round Countdown
      roundCountdown = setInterval(() => {
        secondsLeft--;
        updateTimerBar((secondsLeft / 10) * 100);

        if (secondsLeft <= 0) {
          clearAllTimers();
          if (!questionAnswered) {
            questionAnswered = true;
            disableQuizButtons();
            document.getElementById("quizStatus").innerText = "⏰ Time's Up! No points awarded.";
            buttons[qData.correct].style.background = "rgba(46, 213, 115, 0.4)";
            setTimeout(loadNextQuizQuestion, 2000);
          }
        }
      }, 1000);

      // Bot Simulation Logic
      const botDelay = Math.random() * 3000 + 1500; // 1.5s - 4.5s
      botTimer = setTimeout(() => {
        if (!questionAnswered && matchActive) {
          const isCorrect = Math.random() < 0.7; // 70% accuracy
          const opponentName = document.getElementById("p2Name").innerText;

          questionAnswered = true;
          disableQuizButtons();
          clearAllTimers();

          if (isCorrect) {
            p2Score++;
            document.getElementById("p2Score").innerText = p2Score;
            buttons[qData.correct].style.background = "rgba(46, 213, 115, 0.4)";
            document.getElementById("quizStatus").innerText = `⚡ ${opponentName} answered correctly! (+1 Point)`;
          } else {
            // Pick a random wrong answer to highlight
            let wrongIdx = Math.floor(Math.random() * 4);
            if (wrongIdx === qData.correct) wrongIdx = (qData.correct + 1) % 4;
            
            buttons[wrongIdx].style.background = "rgba(255, 71, 87, 0.4)";
            buttons[qData.correct].style.background = "rgba(46, 213, 115, 0.4)";
            document.getElementById("quizStatus").innerText = `❌ ${opponentName} answered incorrectly!`;
          }

          checkQuizWinner();
        }
      }, botDelay);
    }

    function answerQuiz(optionIndex) {
      if (questionAnswered || !matchActive) return;
      
      questionAnswered = true;
      clearAllTimers();
      disableQuizButtons();

      const qData = quizDatabase[currentQuizIndex];
      const buttons = document.querySelectorAll("#quizAnswers .ans-btn");

      if (optionIndex === qData.correct) {
        p1Score++;
        document.getElementById("p1Score").innerText = p1Score;
        buttons[optionIndex].style.background = "rgba(46, 213, 115, 0.4)";
        document.getElementById("quizStatus").innerText = "🎯 Correct! Point to YOU!";
      } else {
        buttons[optionIndex].style.background = "rgba(255, 71, 87, 0.4)";
        buttons[qData.correct].style.background = "rgba(46, 213, 115, 0.4)";
        document.getElementById("quizStatus").innerText = "❌ Wrong Answer!";
      }

      checkQuizWinner();
    }

    function updateTimerBar(percent) {
      document.getElementById("timerFill").style.width = `${Math.max(0, percent)}%`;
    }

    function disableQuizButtons() {
      document.querySelectorAll("#quizAnswers .ans-btn").forEach(btn => btn.disabled = true);
    }

    function checkQuizWinner() {
      if (p1Score >= 5) {
        document.getElementById("quizStatus").innerText = "🏆 VICTORY! You won the 1v1 Quiz Arena!";
        matchActive = false;
      } else if (p2Score >= 5) {
        document.getElementById("quizStatus").innerText = `💀 DEFEAT! ${document.getElementById("p2Name").innerText} won the match.`;
        matchActive = false;
      } else {
        setTimeout(loadNextQuizQuestion, 2200);
      }
    }

    function leaveQuizMatch() {
      matchActive = false;
      clearAllTimers();
      
      document.getElementById("matchArea").style.display = "none";
      document.getElementById("queueBox").style.display = "flex";
      leaveQueue();
    }

    function clearAllTimers() {
      if (queueTimer) clearInterval(queueTimer);
      if (botTimer) clearTimeout(botTimer);
      if (roundCountdown) clearInterval(roundCountdown);
    }
  </script>
</body>
</html>
