<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascendant SMP - Account & Admin Portal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --danger: #ef4444;
            --success: #22c55e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin-top: 20px;
        }

        nav {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        nav button, nav a {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        nav button:hover, nav button.active, nav a:hover {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: none;
        }

        .panel.active {
            display: block;
        }

        h2 {
            margin-top: 0;
            color: var(--accent-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9em;
            color: var(--text-sub);
        }

        input {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.95em;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button.btn-submit {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1em;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button.btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            text-transform: uppercase;
        }

        .badge.pending { background-color: #eab308; color: #000; }
        .badge.approved { background-color: var(--success); color: #000; }
        .badge.declined { background-color: var(--danger); color: #fff; }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-btns button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-approve { background-color: var(--success); color: #000; }
        .btn-decline { background-color: var(--danger); color: #fff; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>Ascendant SMP</h1>

    <nav>
        <button id="nav-login" class="active" onclick="switchTab('login')">Player Login</button>
        <button id="nav-register" onclick="switchTab('register')">Player Register</button>
        <button id="nav-admin-login" onclick="switchTab('admin-login')">Admin Login</button>
        <button id="nav-admin-panel" class="hidden" onclick="switchTab('admin-panel')">Admin Dashboard</button>
        <a href="support.html">Support Tickets Center ↗</a>
        <button id="nav-logout" class="hidden" onclick="logout()">Logout</button>
    </nav>

    <div class="container">

        <!-- PLAYER LOGIN -->
        <div id="panel-login" class="panel active">
            <h2>Player Login</h2>
            <form onsubmit="handlePlayerLogin(event)">
                <div class="form-group">
                    <label>Minecraft IGN</label>
                    <input type="text" id="user-login-ign" required placeholder="Enter your IGN">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="user-login-pass" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn-submit">Login</button>
            </form>
        </div>

        <!-- PLAYER REGISTER -->
        <div id="panel-register" class="panel">
            <h2>Register Account</h2>
            <form onsubmit="handlePlayerRegister(event)">
                <div class="form-group">
                    <label>Minecraft IGN *</label>
                    <input type="text" id="reg-ign" required placeholder="Your Minecraft in-game name">
                </div>
                <div class="form-group">
                    <label>Discord Handle *</label>
                    <input type="text" id="reg-discord" required placeholder="e.g. username#0000">
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <input type="password" id="reg-pass" required placeholder="Create a password">
                </div>
                <button type="submit" class="btn-submit">Register Account</button>
            </form>
        </div>

        <!-- ADMIN LOGIN -->
        <div id="panel-admin-login" class="panel">
            <h2>Admin Login</h2>
            <form onsubmit="handleAdminLogin(event)">
                <div class="form-group">
                    <label>Admin Username</label>
                    <input type="text" id="admin-user" required placeholder="Ali or Fares">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="admin-pass" required placeholder="Enter password">
                </div>
                <div class="form-group">
                    <label>Approval Code</label>
                    <input type="password" id="admin-code" required placeholder="Security code">
                </div>
                <button type="submit" class="btn-submit">Admin Login</button>
            </form>
        </div>

        <!-- ADMIN DASHBOARD -->
        <div id="panel-admin-panel" class="panel">
            <h2>Admin Dashboard</h2>
            <p>Welcome, <strong id="admin-name-display">Admin</strong>!</p>
            
            <h3>Submitted Ban Appeals</h3>
            <div id="admin-appeals-list">No appeals yet.</div>

            <h3 style="margin-top: 30px;">Submitted Player Reports</h3>
            <div id="admin-reports-list">No reports yet.</div>
        </div>

    </div>

    <script>
        const ADMINS = {
            "ali": { pass: "Ali@123", name: "Ali" },
            "fares": { pass: "Fares@123", name: "Fares" }
        };
        const APPROVAL_CODE = "11#asc";

        function switchTab(tab) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => {
                if(b.id !== 'nav-logout' && b.id !== 'nav-admin-panel') b.classList.remove('active');
            });

            document.getElementById(`panel-${tab}`).classList.add('active');
            const navBtn = document.getElementById(`nav-${tab}`);
            if(navBtn) navBtn.classList.add('active');
        }

        // Register Account
        function handlePlayerRegister(e) {
            e.preventDefault();
            const ign = document.getElementById('reg-ign').value.trim();
            const discord = document.getElementById('reg-discord').value.trim();
            const pass = document.getElementById('reg-pass').value;

            const users = JSON.parse(localStorage.getItem('asc_users') || '{}');
            if (users[ign.toLowerCase()]) {
                alert('An account with this IGN already exists!');
                return;
            }

            users[ign.toLowerCase()] = { ign, discord, pass };
            localStorage.setItem('asc_users', JSON.stringify(users));
            alert('Registration successful! You can now log in.');
            switchTab('login');
        }

        // Player Login
        function handlePlayerLogin(e) {
            e.preventDefault();
            const ign = document.getElementById('user-login-ign').value.trim().toLowerCase();
            const pass = document.getElementById('user-login-pass').value;

            const users = JSON.parse(localStorage.getItem('asc_users') || '{}');
            if (users[ign] && users[ign].pass === pass) {
                alert(`Welcome back, ${users[ign].ign}!`);
            } else {
                alert('Invalid IGN or password!');
            }
        }

        // Admin Login
        function handleAdminLogin(e) {
            e.preventDefault();
            const user = document.getElementById('admin-user').value.toLowerCase().trim();
            const pass = document.getElementById('admin-pass').value;
            const code = document.getElementById('admin-code').value;

            if (code !== APPROVAL_CODE) {
                alert('Invalid Approval Code!');
                return;
            }

            if (ADMINS[user] && ADMINS[user].pass === pass) {
                localStorage.setItem('asc_logged_admin', ADMINS[user].name);
                showAdminDashboard(ADMINS[user].name);
            } else {
                alert('Invalid Admin Credentials!');
            }
        }

        function showAdminDashboard(name) {
            document.getElementById('admin-name-display').textContent = name;
            document.getElementById('nav-admin-login').classList.add('hidden');
            document.getElementById('nav-admin-panel').classList.remove('hidden');
            document.getElementById('nav-logout').classList.remove('hidden');
            renderAdminLists();
            switchTab('admin-panel');
        }

        function logout() {
            localStorage.removeItem('asc_logged_admin');
            document.getElementById('nav-admin-login').classList.remove('hidden');
            document.getElementById('nav-admin-panel').classList.add('hidden');
            document.getElementById('nav-logout').classList.add('hidden');
            switchTab('login');
        }

        function renderAdminLists() {
            const appeals = JSON.parse(localStorage.getItem('asc_appeals') || '[]');
            const reports = JSON.parse(localStorage.getItem('asc_reports') || '[]');

            const appealsContainer = document.getElementById('admin-appeals-list');
            appealsContainer.innerHTML = appeals.length === 0 ? '<p style="color:var(--text-sub)">No appeals submitted.</p>' :
                appeals.map(item => `
                    <div class="card">
                        <div class="card-header">
                            <span>IGN: ${item.ign} (Discord: ${item.discord})</span>
                            <span class="badge ${item.status}">${item.status}</span>
                        </div>
                        <p><strong>Ban Reason:</strong> ${item.reason}</p>
                        <p><strong>Duration:</strong> ${item.duration}</p>
                        <p><strong>Why Unban:</strong> ${item.explanation}</p>
                        <p><strong>Mods Folder:</strong> <a href="${item.mods}" target="_blank" style="color:var(--accent-color)">View Link</a></p>
                        <p><strong>MC Folder:</strong> <a href="${item.mcfile}" target="_blank" style="color:var(--accent-color)">View Link</a></p>
                        ${item.status === 'pending' ? `
                            <div class="action-btns">
                                <button class="btn-approve" onclick="updateStatus('appeals', ${item.id}, 'approved')">Approve</button>
                                <button class="btn-decline" onclick="updateStatus('appeals', ${item.id}, 'declined')">Decline</button>
                            </div>
                        ` : ''}
                    </div>
                `).join('');

            const reportsContainer = document.getElementById('admin-reports-list');
            reportsContainer.innerHTML = reports.length === 0 ? '<p style="color:var(--text-sub)">No reports submitted.</p>' :
                reports.map(item => `
                    <div class="card">
                        <div class="card-header">
                            <span>Target: <span style="color:var(--danger)">${item.targetIgn}</span></span>
                            <span class="badge ${item.status}">${item.status}</span>
                        </div>
                        <p><strong>Reporter:</strong> ${item.reporterIgn} (${item.reporterDiscord})</p>
                        <p><strong>Proof:</strong> <a href="${item.video}" target="_blank" style="color:var(--accent-color)">Watch Video</a></p>
                        ${item.status === 'pending' ? `
                            <div class="action-btns">
                                <button class="btn-approve" onclick="updateStatus('reports', ${item.id}, 'approved')">Accept & Ban</button>
                                <button class="btn-decline" onclick="updateStatus('reports', ${item.id}, 'declined')">Decline</button>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
        }

        function updateStatus(type, id, newStatus) {
            const key = type === 'appeals' ? 'asc_appeals' : 'asc_reports';
            let list = JSON.parse(localStorage.getItem(key) || '[]');
            list = list.map(item => item.id === id ? {...item, status: newStatus} : item);
            localStorage.setItem(key, JSON.stringify(list));
            renderAdminLists();
        }

        window.onload = function() {
            const activeAdmin = localStorage.getItem('asc_logged_admin');
            if (activeAdmin) showAdminDashboard(activeAdmin);
        };
    </script>
</body>
</html>
