<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Support Panel</title>
    <style>
        body { font-family: sans-serif; background: #0c0d10; color: #e1e1e1; margin: 0; padding: 20px; }
        .hidden { display: none !important; }
        .login-box { max-width: 380px; margin: 80px auto; background: #15171c; padding: 30px; border-radius: 8px; border: 1px solid #282c37; text-align: center; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 4px; border: 1px solid #2e3340; background: #0c0d10; color: #fff; box-sizing: border-box; }
        input[type="password"] { font-size: 1.2rem; letter-spacing: 3px; text-align: center; }
        button { background: #ffaa00; color: #000; font-weight: bold; cursor: pointer; border: none; }
        .ticket-card { background: #15171c; border: 1px solid #282c37; padding: 20px; margin-bottom: 20px; border-radius: 8px; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        .Pending { background: #8a6d0b; color: #fff; }
        .Accepted { background: #1e6b29; color: #fff; }
        .Denied { background: #8a1f1f; color: #fff; }
        .Resolved { background: #225c8a; color: #fff; }
        .img-preview { max-width: 100%; max-height: 250px; margin-top: 10px; border-radius: 4px; border: 1px solid #444; display: block; }
        .comments-list { background: #0c0d10; padding: 10px; border-radius: 4px; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- SECURE ADMIN LOGIN -->
    <div id="auth-section" class="login-box">
        <h2>Admin Gateway</h2>
        <p style="font-size:0.85rem; color:#888; margin-top:5px;">Enter your Admin Approval Code to enter</p>
        <form id="login-form">
            <input type="password" id="admin-pass" autocomplete="new-password" placeholder="••••••" required>
            <button type="submit">Log In to Admin Panel</button>
        </form>
        <p id="login-err" style="color: #ff4d4d; font-size: 0.85rem; display: none; margin-top: 10px;">Incorrect Approval Code!</p>
    </div>

    <!-- ADMIN MANAGEMENT PANEL -->
    <div id="panel-section" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1>Support Management Panel</h1>
            <button id="logout-btn" style="width: auto; padding: 8px 16px; background: #c92a2a; color: #fff;">Logout</button>
        </div>

        <div id="tickets-container"></div>
    </div>

    <script>
        // Set your secret Approval Code here (SHA-256 hash of "123456")
        const APPROVAL_CODE_HASH = "8d969eef6ecad3c29a3a629280e686cf0c3f5d5a86aff3ca12020c923adc6c92";

        async function hashString(str) {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
            return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (sessionStorage.getItem("admin_authenticated") === "true") {
                showPanel();
            }

            document.getElementById("login-form").addEventListener("submit", async (e) => {
                e.preventDefault();
                const inputPass = document.getElementById("admin-pass").value;
                const hashedInput = await hashString(inputPass);

                if (hashedInput === APPROVAL_CODE_HASH) {
                    sessionStorage.setItem("admin_authenticated", "true");
                    document.getElementById("login-err").style.display = "none";
                    showPanel();
                } else {
                    document.getElementById("login-err").style.display = "block";
                }
            });

            document.getElementById("logout-btn").addEventListener("click", () => {
                sessionStorage.removeItem("admin_authenticated");
                location.reload();
            });
        });

        function showPanel() {
            document.getElementById("auth-section").classList.add("hidden");
            document.getElementById("panel-section").classList.remove("hidden");
            renderTickets();
        }

        function renderTickets() {
            const container = document.getElementById("tickets-container");
            const tickets = JSON.parse(localStorage.getItem("support_tickets")) || [];

            if (tickets.length === 0) {
                container.innerHTML = "<p style='color:#777;'>No submitted tickets found.</p>";
                return;
            }

            container.innerHTML = tickets.map((t, idx) => `
                <div class="ticket-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3>[${t.type}] #${t.id} - ${escapeHtml(t.ign || t.reporterIgn)}</h3>
                        <span class="badge ${t.status}">${t.status}</span>
                    </div>
                    <p style="color:#888; font-size:0.85rem; margin-top:4px;">Submitted: ${t.date}</p>
                    <br>

                    ${t.type === 'Ban Appeal' ? `
                        <p><strong>Discord Username:</strong> ${escapeHtml(t.discord)}</p>
                        <p><strong>Ban Reason:</strong> ${escapeHtml(t.reason)}</p>
                        <p><strong>Why Unban:</strong> ${escapeHtml(t.explanation)}</p>
                        <div style="margin-top:10px;">
                            <p><strong>Mods Screenshot:</strong></p>
                            <a href="${t.modsImg}" target="_blank"><img src="${t.modsImg}" class="img-preview"/></a>
                            <p style="margin-top:10px;"><strong>Game Files Screenshot:</strong></p>
                            <a href="${t.filesImg}" target="_blank"><img src="${t.filesImg}" class="img-preview"/></a>
                        </div>
                    ` : `
                        <p><strong>Reported Player IGN:</strong> ${escapeHtml(t.targetIgn)}</p>
                        <p><strong>Video Evidence:</strong> <a href="${escapeHtml(t.videoUrl)}" target="_blank" style="color:#ffaa00;">Watch Evidence Video</a></p>
                        <p><strong>Details:</strong> ${escapeHtml(t.details)}</p>
                    `}

                    <hr style="border-color:#282c37; margin:15px 0;">

                    <div>
                        <label><strong>Set Status:</strong></label>
                        <select onchange="updateStatus(${idx}, this.value)">
                            <option value="Pending" ${t.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="Accepted" ${t.status === 'Accepted' ? 'selected' : ''}>Accepted</option>
                            <option value="Denied" ${t.status === 'Denied' ? 'selected' : ''}>Denied</option>
                            <option value="Resolved" ${t.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                        </select>

                        <div class="comments-list">
                            <strong>Admin Comments:</strong>
                            ${(t.comments || []).map(c => `<p style="margin:5px 0; color:#4dabf7;">• ${escapeHtml(c)}</p>`).join('') || '<p style="margin:5px 0; color:#666;">No comments yet.</p>'}
                        </div>

                        <div style="display:flex; gap:10px; margin-top:10px;">
                            <input type="text" id="comment-input-${idx}" placeholder="Type admin comment...">
                            <button onclick="addComment(${idx})" style="width:130px;">Add Comment</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStatus(index, newStatus) {
            const tickets = JSON.parse(localStorage.getItem("support_tickets")) || [];
            tickets[index].status = newStatus;
            localStorage.setItem("support_tickets", JSON.stringify(tickets));
            renderTickets();
        }

        function addComment(index) {
            const input = document.getElementById(`comment-input-${index}`);
            if (!input.value.trim()) return;

            const tickets = JSON.parse(localStorage.getItem("support_tickets")) || [];
            if (!tickets[index].comments) tickets[index].comments = [];
            
            tickets[index].comments.push(input.value.trim());
            localStorage.setItem("support_tickets", JSON.stringify(tickets));
            renderTickets();
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }
    </script>
</body>
</html>
