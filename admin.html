<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 20px; }
        .hidden { display: none; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 400px; margin: 0 auto; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 4px; border: none; }
        button { background: #007bff; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        th { background: #252525; }
    </style>
</head>
<body>

    <!-- LOGIN FORM -->
    <div id="login-section" class="card">
        <h2>Admin Authentication</h2>
        <form id="admin-login-form">
            <input type="text" id="admin-user" placeholder="Username" required>
            <input type="password" id="admin-pass" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p id="error-msg" style="color: red; margin-top: 10px; display: none;">Invalid credentials</p>
    </div>

    <!-- DASHBOARD PANEL -->
    <div id="admin-panel" class="hidden">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Support Admin Dashboard</h1>
            <button id="logout-btn" style="width: auto; padding: 8px 16px;">Logout</button>
        </header>

        <h3>Submitted Tickets</h3>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>User</th>
                    <th>Issue</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="ticket-list">
                <!-- Dynamic Content Loaded Here -->
            </tbody>
        </table>
    </div>

    <script src="admin.js"></script>
</body>
</html>
