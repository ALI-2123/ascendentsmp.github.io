<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Support Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0c0d10; color: #e1e1e1; margin: 0; padding: 20px; }
        .hidden { display: none !important; }
        .login-box { max-width: 400px; margin: 80px auto; background: #141619; padding: 30px; border-radius: 10px; border: 1px solid #282c37; text-align: center; }
        input, select, textarea, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 6px; border: 1px solid #282c37; background: #0c0d10; color: #fff; box-sizing: border-box; }
        button { background: #ffaa00; color: #000; font-weight: bold; cursor: pointer; border: none; margin-top: 15px; }
        button:hover { background: #e09500; }
        .ticket-card { background: #141619; border: 1px solid #282c37; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
        .badge { padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        .Pending { background: #8a6d0b; color: #fff; }
        .Accepted { background: #1e6b29; color: #fff; }
        .Denied { background: #8a1f1f; color: #fff; }
        .Resolved { background: #225c8a; color: #fff; }
        .img-preview { max-width: 100%; max-height: 250px; margin-top: 8px; border-radius: 6px; border: 1px solid #333; display: block; }
        .comments-list { background: #0c0d10; padding: 12px; border-radius: 6px; margin-top: 12px; border: 1px solid #222; }
    </style>
</head>
<body>

    <!-- SECURE ADMIN LOGIN -->
    <div id="auth-section" class="login-box">
        <h2 style="color:#ffaa00;">Admin Gateway</h2>
        <p style="font-size:0.85rem; color:#888; margin-top:5px;">Login with admin account & approval code</p>
        <form id="login-form">
            <input type="text" id="admin-user" placeholder="Username (ali / fares)" required>
            <input type="password" id="admin-pass" placeholder="Password" required>
            <input type="password" id="admin-code" placeholder="Approval Code" required>
            <button type="submit">Log In to Admin Panel</button>
        </form>
        <p id="login-err" style="color: #ff4d4d; font-size: 0.85rem; display: none; margin-top: 12px;"></p>
    </div>

    <!-- ADMIN MANAGEMENT PANEL -->
    <div id="panel-section" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
            <h1>Support Management Panel</h1>
            <div>
                <span id="logged-admin-name" style="color:#ffaa00; font-weight:bold; margin-right:15px;"></span>
                <button id="logout-btn" style="width: auto; padding: 8px 16px; background: #c92a2a; color: #fff; margin:0;">Logout</button>
            </div>
        </div>

        <div id="tickets-container"></div>
    </div>

    <script>
        // ADMIN ACCOUNTS DATA
        const ADMIN_ACCOUNTS = {
            "ali": { pass: "Ali@123", name: "Ali" },
            "fares": { pass: "Fares@123", name: "Fares" }
        };
        const REQUIRED_APPROVAL_CODE = "11#asc";

        document.addEventListener("DOMContentLoaded", () => {
            const activeUser = sessionStorage.getItem("admin_authenticated_user");
            if (activeUser) {
                showPanel(activeUser);
            }

            document.getElementById("login-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const user = document.getElementById("admin-user").value.trim().toLowerCase();
                const pass = document.getElementById("admin-pass").value.trim();
                const code = document.getElementById("admin-code").value.trim();
                const errBox = document.getElementById("login-err");

                if (code !== REQUIRED_APPROVAL_CODE) {
                    errBox.innerText = "Invalid Approval Code!";
                    errBox.style.display = "block";
                    return;
                }

                if (ADMIN_ACCOUNTS[user] && ADMIN_ACCOUNTS[user].pass === pass) {
                    sessionStorage.setItem("admin_authenticated_user", ADMIN_ACCOUNTS[user].name);
                    errBox.style.display = "none";
                    showPanel(ADMIN_ACCOUNTS[user].name);
                } else {
                    errBox.innerText = "Invalid Admin Username or Password!";
                    errBox.style.display = "block";
                }
            });

            document.getElementById("logout-btn").addEventListener("click", () => {
                sessionStorage.removeItem("admin_authenticated_user");
                location.reload();
            });
        });

        function showPanel(adminName) {
            document.getElementById("auth-section").classList.add("hidden");
            document.getElementById("panel-section").classList.remove("hidden");
            document.getElementById("logged-admin-name").innerText = "Admin: " + adminName;
            renderTickets();
        }

        function renderTickets() {
            const container = document.getElementById("tickets-container");
            const tickets = JSON.parse(localStorage.getItem("support_tickets")) || [];

            if (tickets.length === 0) {
                container.innerHTML = "<p style='color:#777;'>No submitted tickets found.</p>";
                return;
            }

            container.innerHTML = tickets.map((t, idx) => `
                <div class="ticket-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <h3>[${t.type}] #${t.id} - ${escapeHtml(t.ign || t.reporterIgn)}</h3>
                        <span class="badge ${t.status}">${t.status}</span>
                    </div>
                    <p style="color:#888; font-size:0.85rem; margin-top:4px;">Submitted: ${t.date}</p>
                    <br>

                    ${t.type === 'Ban Appeal' ? `
                        <p><strong>Discord Username:</strong> ${escapeHtml(t.discord)}</p>
                        <p><strong>Ban Reason:</strong> ${escapeHtml(t.reason)}</p>
                        <p><strong>Explanation:</strong> ${escapeHtml(t.explanation)}</p>
                        <div style="margin-top:10px;">
                            <p><strong>Mods Screenshot:</strong></p>
                            <a href="${t.modsImg}" target="_blank"><img src="${t.modsImg}" class="img-preview"/></a>
                            <p style="margin-top:10px;"><strong>Game Files Screenshot:</strong></p>
                            <a href="${t.filesImg}" target="_blank"><img src="${t.filesImg}" class="img-preview"/></a>
                        </div>
                    ` : `
                        <p><strong>Reported Player IGN:</strong> ${escapeHtml(t.targetIgn)}</p>
                        <p><strong>Video Evidence:</strong> <a href="${escapeHtml(t.videoUrl)}" target="_blank" style="color:#ffaa00;">Watch Video</a></p>
                        <p><strong>Details:</strong> ${escapeHtml(t.details)}</p>
                    `}

                    <hr style="border-color:#282c37; margin:15px 0;">

                    <div>
                        <label><strong>Change Status:</strong></label>
                        <select onchange="updateStatus(${idx}, this.value)" style="margin-bottom:10px;">
                            <option value="Pending" ${t.status === 'Pending' ? 'selected' : ''}>Pending (Waiting for Respond)</option>
                            <option value="Accepted" ${t.status === 'Accepted' ? 'selected' : ''}>Accepted</option>
                            <option value="Denied" ${t.status === 'Denied' ? 'selected' : ''}>Denied</option>
                            <option value="Resolved" ${t.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                        </select>

                        <div class="comments-list">
                            <strong>Admin Comments & Responses:</strong>
                            ${(t.comments || []).map(c => `<p style="margin:5px 0; color:#4dabf7;">• <strong>${escapeHtml(c.author)}:</strong> ${escapeHtml(c.text)}</p>`).join('') || '<p style="margin:5px 0; color:#666;">No comments added yet.</p>'}
                        </div>

                        <div style="display:flex; gap:10px; margin-top:10px;">
                            <input type="text" id="comment-input-${idx}" placeholder="Type admin comment...">
                            <button onclick="addComment(${idx})" style="width:140px; margin-top:10px;">Add Comment</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateStatus(index, newStatus) {
            const tickets = JSON.parse(localStorage.getItem("support_tickets")) || [];
            tickets[index].status = newStatus;
            localStorage.setItem("support_tickets", JSON.stringify(tickets));
            renderTickets();
        }

        function addComment(index) {
            const input = document.getElementById(`comment-input-${index}`);
            if (!input.value.trim()) return;

            const currentAdmin = sessionStorage.getItem("admin_authenticated_user") || "Admin";
            const tickets = JSON.parse(localStorage.getItem("support_tickets")) || [];
            if (!tickets[index].comments) tickets[index].comments = [];
            
            tickets[index].comments.push({
                author: currentAdmin,
                text: input.value.trim()
            });

            localStorage.setItem("support_tickets", JSON.stringify(tickets));
            renderTickets();
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }
    </script>
</body>
</html>
