<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support & Tickets</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f1115; 
            color: #fff; 
            padding: 30px 10px; 
            margin: 0;
        }
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
            background: #181a20; 
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid #2a2e39; 
        }
        .tab-buttons { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 25px; 
        }
        .tab-btn { 
            flex: 1; 
            padding: 12px; 
            background: #222630; 
            border: none; 
            color: #aaa; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        .tab-btn.active { 
            background: #ffaa00; 
            color: #000; 
        }
        .form-section { 
            display: none; 
        }
        .form-section.active { 
            display: block; 
        }
        .form-group { 
            margin-bottom: 15px; 
        }
        label { 
            display: block; 
            margin-bottom: 6px; 
            color: #ccc; 
            font-size: 0.9rem; 
        }
        input, textarea { 
            width: 100%; 
            padding: 10px; 
            border-radius: 6px; 
            border: 1px solid #333; 
            background: #0f1115; 
            color: #fff; 
            box-sizing: border-box; 
        }
        textarea { 
            height: 90px; 
            resize: vertical; 
        }
        button[type="submit"] { 
            width: 100%; 
            padding: 12px; 
            background: #ffaa00; 
            border: none; 
            border-radius: 6px; 
            color: #000; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 10px; 
        }
        button[type="submit"]:hover { 
            background: #e09500; 
        }
        .status-msg { 
            margin-top: 15px; 
            padding: 12px; 
            border-radius: 6px; 
            display: none; 
            text-align: center; 
            line-height: 1.4;
        }
        .nav-back { 
            display: inline-block; 
            margin-bottom: 20px; 
            color: #ffaa00; 
            text-decoration: none; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="nav-back">← Back to Main Page</a>
        
        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('appeal')">Ban Appeal</button>
            <button class="tab-btn" onclick="switchTab('report')">Player Report</button>
        </div>

        <!-- BAN APPEAL FORM -->
        <form id="appeal-form" class="form-section active">
            <h2>Ban Appeal</h2>
            <div class="form-group">
                <label>In-Game Name (IGN)</label>
                <input type="text" id="appeal-ign" required>
            </div>
            <div class="form-group">
                <label>Discord Username</label>
                <input type="text" id="appeal-discord" required>
            </div>
            <div class="form-group">
                <label>Ban Reason</label>
                <input type="text" id="appeal-reason" required>
            </div>
            <div class="form-group">
                <label>Why should you be unbanned?</label>
                <textarea id="appeal-explanation" required></textarea>
            </div>
            <div class="form-group">
                <label>Minecraft Mods Folder Screenshot</label>
                <input type="file" id="appeal-mods-img" accept="image/*" required>
            </div>
            <div class="form-group">
                <label>Minecraft Game Directory / Files Screenshot</label>
                <input type="file" id="appeal-files-img" accept="image/*" required>
            </div>
            <button type="submit">Submit Ban Appeal</button>
        </form>

        <!-- PLAYER REPORT FORM -->
        <form id="report-form" class="form-section">
            <h2>Report a Player</h2>
            <div class="form-group">
                <label>Your IGN</label>
                <input type="text" id="report-your-ign" required>
            </div>
            <div class="form-group">
                <label>Reported Player's IGN</label>
                <input type="text" id="report-target-ign" required>
            </div>
            <div class="form-group">
                <label>Video Evidence URL (YouTube / Medal / Streamable)</label>
                <input type="url" id="report-video-url" placeholder="https://..." required>
            </div>
            <div class="form-group">
                <label>Additional Context / Details</label>
                <textarea id="report-details" required></textarea>
            </div>
            <button type="submit">Submit Player Report</button>
        </form>

        <div id="status-box" class="status-msg"></div>
    </div>

    <script src="support.js"></script>
</body>
</html>
