<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ascendant SMP - Support & Admin Portal</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --danger: #ef4444;
            --success: #22c55e;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
        }

        nav {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        nav button {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        nav button:hover, nav button.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        .panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: none;
        }

        .panel.active {
            display: block;
        }

        h2 {
            margin-top: 0;
            color: var(--accent-color);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9em;
            color: var(--text-sub);
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            box-sizing: border-box;
            font-size: 0.95em;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        button.btn-submit {
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1em;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button.btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .card {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            text-transform: uppercase;
        }

        .badge.pending { background-color: #eab308; color: #000; }
        .badge.approved { background-color: var(--success); color: #000; }
        .badge.declined { background-color: var(--danger); color: #fff; }

        .action-btns {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-btns button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-approve { background-color: var(--success); color: #000; }
        .btn-decline { background-color: var(--danger); color: #fff; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>Ascendant SMP Portal</h1>

    <nav>
        <button id="nav-appeal" class="active" onclick="switchTab('appeal')">Ban Appeal</button>
        <button id="nav-report" onclick="switchTab('report')">Report Player</button>
        <button id="nav-login" onclick="switchTab('login')">Admin Login</button>
        <button id="nav-admin" class="hidden" onclick="switchTab('admin')">Admin Panel</button>
        <button id="nav-logout" class="hidden" onclick="logoutAdmin()">Logout</button>
    </nav>

    <div class="container">

        <!-- BAN APPEAL PANEL -->
        <div id="panel-appeal" class="panel active">
            <h2>Ban Appeal</h2>
            <form id="form-appeal" onsubmit="submitAppeal(event)">
                <div class="form-group">
                    <label>Your Minecraft IGN *</label>
                    <input type="text" id="appeal-ign" required placeholder="e.g. Stev3">
                </div>
                <div class="form-group">
                    <label>Your Discord Username *</label>
                    <input type="text" id="appeal-discord" required placeholder="e.g. user#0000 or username">
                </div>
                <div class="form-group">
                    <label>Ban Reason *</label>
                    <input type="text" id="appeal-reason" required placeholder="Why were you banned?">
                </div>
                <div class="form-group">
                    <label>Ban Duration *</label>
                    <input type="text" id="appeal-duration" required placeholder="e.g. 7 Days, Permanent">
                </div>
                <div class="form-group">
                    <label>Why should you be unbanned? *</label>
                    <textarea id="appeal-explanation" rows="4" required placeholder="Explain your situation..."></textarea>
                </div>
                <div class="form-group">
                    <label>Mods Folder Screenshot Link *</label>
                    <input type="url" id="appeal-mods" required placeholder="https://imgur.com/...">
                </div>
                <div class="form-group">
                    <label>Minecraft (.minecraft) Folder Screenshot Link *</label>
                    <input type="url" id="appeal-mcfile" required placeholder="https://imgur.com/...">
                </div>
                <button type="submit" class="btn-submit">Submit Ban Appeal</button>
            </form>
        </div>

        <!-- REPORT PLAYER PANEL -->
        <div id="panel-report" class="panel">
            <h2>Report Player</h2>
            <form id="form-report" onsubmit="submitReport(event)">
                <div class="form-group">
                    <label>Your Minecraft IGN *</label>
                    <input type="text" id="reporter-ign" required placeholder="Your in-game name">
                </div>
                <div class="form-group">
                    <label>Your Discord Username *</label>
                    <input type="text" id="reporter-discord" required placeholder="Your Discord handle">
                </div>
                <div class="form-group">
                    <label>Reported Player IGN *</label>
                    <input type="text" id="target-ign" required placeholder="Cheater's in-game name">
                </div>
                <div class="form-group">
                    <label>Video Evidence Link (Cheating Proof) *</label>
                    <input type="url" id="report-video" required placeholder="https://youtube.com/... or Streamable link">
                </div>
                <button type="submit" class="btn-submit">Submit Player Report</button>
            </form>
        </div>

        <!-- ADMIN LOGIN PANEL -->
        <div id="panel-login" class="panel">
            <h2>Admin Login</h2>
            <form id="form-login" onsubmit="loginAdmin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-user" required placeholder="Enter admin username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-pass" required placeholder="Enter password">
                </div>
                <div class="form-group">
                    <label>Approval Security Code</label>
                    <input type="password" id="login-code" required placeholder="Enter approval code">
                </div>
                <button type="submit" class="btn-submit">Login</button>
            </form>
        </div>

        <!-- ADMIN DASHBOARD PANEL -->
        <div id="panel-admin" class="panel">
            <h2>Admin Management Dashboard</h2>
            <p>Welcome, <strong id="admin-display-name">Admin</strong>!</p>
            
            <h3>Submitted Ban Appeals</h3>
            <div id="admin-appeals-list">No appeals submitted yet.</div>

            <h3 style="margin-top: 30px;">Submitted Player Reports</h3>
            <div id="admin-reports-list">No reports submitted yet.</div>
        </div>

    </div>

    <script>
        // ADMIN CREDENTIALS CONFIGURATION
        const ADMINS = {
            "ali": { pass: "Ali@123", name: "Ali" },
            "fares": { pass: "Fares@123", name: "Fares" }
        };
        const APPROVAL_CODE = "11#asc";

        // Navigation Tabs Toggle
        function switchTab(tab) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => {
                if(b.id !== 'nav-logout' && b.id !== 'nav-admin') b.classList.remove('active');
            });

            document.getElementById(`panel-${tab}`).classList.add('active');
            const navBtn = document.getElementById(`nav-${tab}`);
            if(navBtn) navBtn.classList.add('active');
        }

        // Handle Appeal Submission
        function submitAppeal(e) {
            e.preventDefault();
            const appealData = {
                id: Date.now(),
                type: 'Ban Appeal',
                ign: document.getElementById('appeal-ign').value,
                discord: document.getElementById('appeal-discord').value,
                reason: document.getElementById('appeal-reason').value,
                duration: document.getElementById('appeal-duration').value,
                explanation: document.getElementById('appeal-explanation').value,
                mods: document.getElementById('appeal-mods').value,
                mcfile: document.getElementById('appeal-mcfile').value,
                status: 'pending',
                date: new Date().toLocaleDateString()
            };

            const list = JSON.parse(localStorage.getItem('asc_appeals') || '[]');
            list.push(appealData);
            localStorage.setItem('asc_appeals', JSON.stringify(list));

            alert('Your Ban Appeal has been submitted successfully!');
            document.getElementById('form-appeal').reset();
        }

        // Handle Player Report Submission
        function submitReport(e) {
            e.preventDefault();
            const reportData = {
                id: Date.now(),
                type: 'Player Report',
                reporterIgn: document.getElementById('reporter-ign').value,
                reporterDiscord: document.getElementById('reporter-discord').value,
                targetIgn: document.getElementById('target-ign').value,
                video: document.getElementById('report-video').value,
                status: 'pending',
                date: new Date().toLocaleDateString()
            };

            const list = JSON.parse(localStorage.getItem('asc_reports') || '[]');
            list.push(reportData);
            localStorage.setItem('asc_reports', JSON.stringify(list));

            alert('Player report submitted successfully!');
            document.getElementById('form-report').reset();
        }

        // Handle Admin Login
        function loginAdmin(e) {
            e.preventDefault();
            const user = document.getElementById('login-user').value.toLowerCase().trim();
            const pass = document.getElementById('login-pass').value;
            const code = document.getElementById('login-code').value;

            if (code !== APPROVAL_CODE) {
                alert('Invalid Security Approval Code!');
                return;
            }

            if (ADMINS[user] && ADMINS[user].pass === pass) {
                localStorage.setItem('asc_logged_admin', ADMINS[user].name);
                showAdminDashboard(ADMINS[user].name);
            } else {
                alert('Invalid Username or Password!');
            }
        }

        // Show Admin Navigation & Load Lists
        function showAdminDashboard(adminName) {
            document.getElementById('admin-display-name').textContent = adminName;
            document.getElementById('nav-login').classList.add('hidden');
            document.getElementById('nav-admin').classList.remove('hidden');
            document.getElementById('nav-logout').classList.remove('hidden');
            
            renderAdminLists();
            switchTab('admin');
        }

        // Admin Logout
        function logoutAdmin() {
            localStorage.removeItem('asc_logged_admin');
            document.getElementById('nav-login').classList.remove('hidden');
            document.getElementById('nav-admin').classList.add('hidden');
            document.getElementById('nav-logout').classList.add('hidden');
            switchTab('appeal');
        }

        // Render Submissions into Admin Panel
        function renderAdminLists() {
            const appeals = JSON.parse(localStorage.getItem('asc_appeals') || '[]');
            const reports = JSON.parse(localStorage.getItem('asc_reports') || '[]');

            // Render Appeals
            const appealsContainer = document.getElementById('admin-appeals-list');
            if (appeals.length === 0) {
                appealsContainer.innerHTML = '<p style="color:var(--text-sub)">No appeals submitted yet.</p>';
            } else {
                appealsContainer.innerHTML = appeals.map(item => `
                    <div class="card">
                        <div class="card-header">
                            <span>IGN: ${item.ign} (Discord: ${item.discord})</span>
                            <span class="badge ${item.status}">${item.status}</span>
                        </div>
                        <p><strong>Ban Reason:</strong> ${item.reason}</p>
                        <p><strong>Ban Duration:</strong> ${item.duration}</p>
                        <p><strong>Why Unban:</strong> ${item.explanation}</p>
                        <p><strong>Mods Screenshot:</strong> <a href="${item.mods}" target="_blank" style="color:var(--accent-color)">View Screenshot</a></p>
                        <p><strong>MC File Screenshot:</strong> <a href="${item.mcfile}" target="_blank" style="color:var(--accent-color)">View Screenshot</a></p>
                        ${item.status === 'pending' ? `
                            <div class="action-btns">
                                <button class="btn-approve" onclick="updateStatus('appeals', ${item.id}, 'approved')">Approve Appeal</button>
                                <button class="btn-decline" onclick="updateStatus('appeals', ${item.id}, 'declined')">Decline Appeal</button>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            }

            // Render Reports
            const reportsContainer = document.getElementById('admin-reports-list');
            if (reports.length === 0) {
                reportsContainer.innerHTML = '<p style="color:var(--text-sub)">No reports submitted yet.</p>';
            } else {
                reportsContainer.innerHTML = reports.map(item => `
                    <div class="card">
                        <div class="card-header">
                            <span>Reported Player: <span style="color:var(--danger)">${item.targetIgn}</span></span>
                            <span class="badge ${item.status}">${item.status}</span>
                        </div>
                        <p><strong>Reported By:</strong> ${item.reporterIgn} (Discord: ${item.reporterDiscord})</p>
                        <p><strong>Video Proof:</strong> <a href="${item.video}" target="_blank" style="color:var(--accent-color)">Watch Video Proof</a></p>
                        ${item.status === 'pending' ? `
                            <div class="action-btns">
                                <button class="btn-approve" onclick="updateStatus('reports', ${item.id}, 'approved')">Accept & Ban</button>
                                <button class="btn-decline" onclick="updateStatus('reports', ${item.id}, 'declined')">Decline Report</button>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            }
        }

        // Admin Action Handlers (Approve/Decline)
        function updateStatus(type, id, newStatus) {
            const storageKey = type === 'appeals' ? 'asc_appeals' : 'asc_reports';
            let list = JSON.parse(localStorage.getItem(storageKey) || '[]');
            
            list = list.map(item => {
                if (item.id === id) item.status = newStatus;
                return item;
            });

            localStorage.setItem(storageKey, JSON.stringify(list));
            renderAdminLists();
        }

        // Auto Login Check on Refresh
        window.onload = function() {
            const activeAdmin = localStorage.getItem('asc_logged_admin');
            if (activeAdmin) {
                showAdminDashboard(activeAdmin);
            }
        };
    </script>
</body>
</html>
