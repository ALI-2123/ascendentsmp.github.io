<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support & Community - Ascendant SMP</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0c0d10; 
            color: #fff; 
            padding: 30px 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container { 
            width: 100%;
            max-width: 750px; 
            background: #141619; 
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid #282c37; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .nav-back { 
            display: inline-block; 
            margin-bottom: 20px; 
            color: #ffaa00; 
            text-decoration: none; 
            font-weight: bold; 
            transition: color 0.2s;
        }

        .nav-back:hover { color: #e09500; }

        .tab-buttons { 
            display: flex; 
            gap: 10px; 
            margin-bottom: 25px; 
            flex-wrap: wrap; 
        }

        .tab-btn { 
            flex: 1; 
            padding: 12px; 
            background: #1f232d; 
            border: 1px solid #282c37; 
            color: #a0a5b1; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            min-width: 120px; 
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover { 
            background: #ffaa00; 
            color: #000; 
            border-color: #ffaa00;
        }

        .form-section { display: none; }
        .form-section.active { display: block; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: #ccc; font-size: 0.9rem; font-weight: 600; }
        input, textarea { 
            width: 100%; 
            padding: 11px; 
            border-radius: 6px; 
            border: 1px solid #282c37; 
            background: #0c0d10; 
            color: #fff; 
            font-size: 0.95rem;
        }
        input:focus, textarea:focus { border-color: #ffaa00; outline: none; }
        textarea { height: 90px; resize: vertical; }

        button[type="submit"] { 
            width: 100%; 
            padding: 12px; 
            background: #ffaa00; 
            border: none; 
            border-radius: 6px; 
            color: #000; 
            font-weight: 800; 
            cursor: pointer; 
            margin-top: 10px; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        button[type="submit"]:hover { background: #e09500; }

        .status-msg { 
            margin-top: 20px; 
            padding: 14px; 
            border-radius: 6px; 
            display: none; 
            text-align: center; 
            font-size: 0.95rem;
            line-height: 1.4;
        }

        /* LIVE CHAT SECTION */
        .chat-box { 
            height: 320px; 
            background: #0c0d10; 
            border: 1px solid #282c37; 
            border-radius: 6px; 
            padding: 15px; 
            overflow-y: auto; 
            margin-bottom: 15px; 
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-msg { 
            background: #141619;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #1f232d;
            font-size: 0.95rem; 
        }
        .chat-msg .author { color: #ffaa00; font-weight: bold; }
        .chat-msg .time { color: #6c727f; font-size: 0.75rem; margin-left: 8px; }

        .chat-input-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .chat-input-group input[type="text"] { font-size: 0.9rem; }
        .chat-input-group button { 
            width: 100px; 
            background: #ffaa00; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 6px; 
            color: #000;
        }
        .chat-input-group button:hover { background: #e09500; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="nav-back">← Back to Main Portal</a>
        
        <div class="tab-buttons">
            <button class="tab-btn active" id="btn-appeal" onclick="switchTab('appeal')">Ban Appeal</button>
            <button class="tab-btn" id="btn-report" onclick="switchTab('report')">Player Report</button>
            <button class="tab-btn" id="btn-chat" onclick="switchTab('chat')">Player Chat 💬</button>
        </div>

        <!-- BAN APPEAL FORM -->
        <form id="appeal-form" class="form-section active">
            <h2 style="color:#ffaa00; margin-bottom: 6px;">Ban Appeal</h2>
            <p style="color:#a0a5b1; font-size:0.85rem; margin-bottom:20px;">Submit your appeal below. Staff will review your submission.</p>
            
            <div class="form-group">
                <label>In-Game Name (IGN)</label>
                <input type="text" id="appeal-ign" required placeholder="e.g. Player123">
            </div>
            <div class="form-group">
                <label>Discord Username</label>
                <input type="text" id="appeal-discord" required placeholder="username#0000">
            </div>
            <div class="form-group">
                <label>Ban Reason</label>
                <input type="text" id="appeal-reason" required placeholder="Reason shown on ban screen">
            </div>
            <div class="form-group">
                <label>Why should you get unbanned?</label>
                <textarea id="appeal-explanation" required placeholder="Provide full details..."></textarea>
            </div>
            <div class="form-group">
                <label>Screenshot of MC Mods Folder</label>
                <input type="file" id="appeal-mods-img" accept="image/*" required>
            </div>
            <div class="form-group">
                <label>Screenshot of MC Game Directory/Files</label>
                <input type="file" id="appeal-files-img" accept="image/*" required>
            </div>
            <button type="submit">Submit Ban Appeal</button>
        </form>

        <!-- PLAYER REPORT FORM -->
        <form id="report-form" class="form-section">
            <h2 style="color:#ffaa00; margin-bottom: 6px;">Player Report</h2>
            <p style="color:#a0a5b1; font-size:0.85rem; margin-bottom:20px;">Report cheaters or rulebreakers directly to staff.</p>
            
            <div class="form-group">
                <label>Your IGN</label>
                <input type="text" id="report-your-ign" required placeholder="Your Minecraft username">
            </div>
            <div class="form-group">
                <label>Reported Player IGN</label>
                <input type="text" id="report-target-ign" required placeholder="Cheater's username">
            </div>
            <div class="form-group">
                <label>Video Evidence (URL)</label>
                <input type="url" id="report-video-url" placeholder="https://youtube.com/watch?v=..." required>
            </div>
            <div class="form-group">
                <label>Additional Details</label>
                <textarea id="report-details" required placeholder="Explain what happened..."></textarea>
            </div>
            <button type="submit">Submit Player Report</button>
        </form>

        <!-- LIVE PLAYER CHAT -->
        <div id="chat-section" class="form-section">
            <h2 style="color:#ffaa00; margin-bottom: 6px;">Community Chat 💬</h2>
            <p style="color:#a0a5b1; font-size:0.85rem; margin-bottom:15px;">Chat and hang out with other online players!</p>
            
            <div class="chat-box" id="chat-messages"></div>

            <div class="chat-input-group">
                <input type="text" id="chat-username" placeholder="Your IGN" style="flex: 1; min-width: 120px;" required>
                <input type="text" id="chat-msg-input" placeholder="Type a message..." style="flex: 2; min-width: 180px;" required>
                <button onclick="sendChatMessage()">Send</button>
            </div>
        </div>

        <div id="status-box" class="status-msg"></div>
    </div>

    <script>
        function switchTab(type) {
            document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (type === 'appeal') {
                document.getElementById('appeal-form').classList.add('active');
                document.getElementById('btn-appeal').classList.add('active');
            } else if (type === 'report') {
                document.getElementById('report-form').classList.add('active');
                document.getElementById('btn-report').classList.add('active');
            } else if (type === 'chat') {
                document.getElementById('chat-section').classList.add('active');
                document.getElementById('btn-chat').classList.add('active');
                loadChatMessages();
            }
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        document.getElementById('appeal-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                const modsFile = document.getElementById('appeal-mods-img').files[0];
                const filesFile = document.getElementById('appeal-files-img').files[0];

                const ticket = {
                    id: 'APP-' + Math.floor(1000 + Math.random() * 9000),
                    type: 'Ban Appeal',
                    ign: document.getElementById('appeal-ign').value,
                    discord: document.getElementById('appeal-discord').value,
                    reason: document.getElementById('appeal-reason').value,
                    explanation: document.getElementById('appeal-explanation').value,
                    modsImg: await fileToBase64(modsFile),
                    filesImg: await fileToBase64(filesFile),
                    status: 'Pending',
                    comments: [],
                    date: new Date().toLocaleDateString()
                };

                saveTicket(ticket);
                e.target.reset();
            } catch (err) {
                alert("Image size is too large! Please choose a smaller image.");
            }
        });

        document.getElementById('report-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const ticket = {
                id: 'REP-' + Math.floor(1000 + Math.random() * 9000),
                type: 'Player Report',
                reporterIgn: document.getElementById('report-your-ign').value,
                targetIgn: document.getElementById('report-target-ign').value,
                videoUrl: document.getElementById('report-video-url').value,
                details: document.getElementById('report-details').value,
                status: 'Pending',
                comments: [],
                date: new Date().toLocaleDateString()
            };

            saveTicket(ticket);
            e.target.reset();
        });

        function saveTicket(ticket) {
            const tickets = JSON.parse(localStorage.getItem('support_tickets')) || [];
            tickets.unshift(ticket);
            localStorage.setItem('support_tickets', JSON.stringify(tickets));

            const statusBox = document.getElementById('status-box');
            statusBox.style.display = 'block';
            statusBox.style.background = '#1b3e20';
            statusBox.style.color = '#5cdb6d';
            statusBox.style.border = '1px solid #28542c';
            statusBox.innerHTML = `Ticket Submitted Successfully!<br>Ticket ID: <strong>#${ticket.id}</strong>.<br>Please wait for an admin response.`;
        }

        /* CHAT FUNCTIONALITY */
        function loadChatMessages() {
            const chatBox = document.getElementById('chat-messages');
            const messages = JSON.parse(localStorage.getItem('player_chat')) || [];
            
            if (messages.length === 0) {
                chatBox.innerHTML = '<p style="color:#666; text-align:center; margin-top:20px;">No messages yet. Say hello!</p>';
                return;
            }

            chatBox.innerHTML = messages.map(m => `
                <div class="chat-msg">
                    <span class="author">${escapeHtml(m.user)}:</span> 
                    <span>${escapeHtml(m.msg)}</span>
                    <span class="time">${m.time}</span>
                </div>
            `).join('');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendChatMessage() {
            const user = document.getElementById('chat-username').value.trim();
            const msg = document.getElementById('chat-msg-input').value.trim();

            if (!user || !msg) {
                alert("Please enter your name and a message.");
                return;
            }

            const messages = JSON.parse(localStorage.getItem('player_chat')) || [];
            messages.push({
                user: user,
                msg: msg,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            });

            localStorage.setItem('player_chat', JSON.stringify(messages));
            document.getElementById('chat-msg-input').value = '';
            loadChatMessages();
        }

        function escapeHtml(str) {
            return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
        }
    </script>
</body>
</html>
