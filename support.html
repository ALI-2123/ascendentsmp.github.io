<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support & Help</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        nav {
            margin-bottom: 30px;
        }
        nav a {
            color: #0088ff;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #1e1e1e;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h2 {
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #ccc;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            border: none;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .success-msg {
            color: #28a745;
            margin-top: 15px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- NAVIGATION BAR -->
    <nav>
        <a href="index.html">← Back to Home</a>
    </nav>

    <!-- SUPPORT FORM CONTAINER -->
    <div class="container">
        <h2>Submit a Support Ticket</h2>
        <form id="support-form">
            <div class="form-group">
                <label for="user-name">Your Name / Username</label>
                <input type="text" id="user-name" placeholder="Enter your username" required>
            </div>

            <div class="form-group">
                <label for="user-message">Describe your issue</label>
                <textarea id="user-message" placeholder="What do you need help with?" required></textarea>
            </div>

            <button type="submit">Send Ticket</button>
        </form>

        <p id="success-msg" class="success-msg">Ticket submitted successfully! An admin will review it soon.</p>
    </div>

    <!-- LINK TO YOUR SEPARATE SUPPORT SCRIPT -->
    <script src="support.js"></script>
</body>
</html>
